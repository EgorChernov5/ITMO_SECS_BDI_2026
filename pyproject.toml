[project]
name = "minikv"
version = "0.1.0"
description = "Учебная архитектура распределённой базы данных MiniKV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
minikv = "src.cli:main"
minikv-api = "src.api.app:main"
minikv-router = "src.sharding.router:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
