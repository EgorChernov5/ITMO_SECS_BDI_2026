services:
  minikv:
    build:
      context: .
    environment:
      MINIKV_DATA_FILE: /data/data.json
    ports:
      - "${MINIKV_PORT:-8000}:8000"
    volumes:
      - minikv-data:/data
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  minikv-data:
